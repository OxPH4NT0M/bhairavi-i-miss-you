<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        /* Basic Page Setup */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars when hearts fall off screen */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
            font-family: system-ui, -apple-system, sans-serif;
            position: relative; /* Needed for z-index layering */
        }

        /* The main text style */
        .message {
            font-weight: 900;
            font-size: 5rem;
            color: #333;
            text-align: center;
            padding: 20px;
            z-index: 10; /* Ensures text stays on top of hearts */
            position: relative;
        }

        /* --- Heart Animation Styles --- */

        /* Container for hearts so they don't interfere with clicks */
        #heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Lets you click through the hearts */
            z-index: 1;
        }

        /* The look of a single heart */
        .heart {
            position: absolute;
            width: 8px;  /* Size of the "pixel" */
            height: 8px;
            background-color: #e91e63; /* A nice pixel-heart pink/red */
            opacity: 0.8;
            /* Rotates the square 45deg to look like a diamond/simple heart */
            transform: rotate(45deg);
            top: -20px; /* Start just above the screen */
            /* The actual falling movement definition */
            animation-name: fallDown;
            animation-timing-function: linear;
        }

        /* Keyframes define the start and end points of the animation */
        @keyframes fallDown {
            to {
                /* End well below the screen */
                top: 110vh;
                 /* Keep the rotation while falling */
                transform: rotate(45deg);
            }
        }

        /* Mobile Text Size Adjust */
        @media (max-width: 600px) {
            .message {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <div class="message">
        I miss you 💔
    </div>

    <script>
        const container = document.getElementById('heart-container');

        // Function to create one heart and set its random properties
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');

            // 1. Randomize horizontal position (0% to 100% across screen)
            heart.style.left = Math.random() * 100 + 'vw';

            // 2. Randomize fall speed (between 3 and 8 seconds)
            const duration = Math.random() * 5 + 3;
            heart.style.animationDuration = duration + 's';

            // 3. Randomize size slightly for variety
            const scale = Math.random() * 0.5 + 0.8; // Scale between 0.8x and 1.3x
            // We must include rotate(45deg) so we don't overwrite the CSS
            heart.style.transform = `rotate(45deg) scale(${scale})`;

            // Add the heart to the page
            container.appendChild(heart);

            // 4. Cleanup! Crucial step: remove the heart element once it falls
            // off-screen so the browser doesn't get slowed down by thousands of invisible elements.
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Start the loop: Run createHeart every 150 milliseconds
        setInterval(createHeart, 150);

        // Create a few immediately so it doesn't start empty
        for(let i = 0; i < 10; i++) createHeart();
    </script>

</body>
</html>
